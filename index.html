<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Global Pulse</title>
  <meta name="description" content="The Global Pulse – privacy policy and support.">
  <meta name="color-scheme" content="dark">
  <style>
    :root { --bg: #0A0D16; --text: #F2F5FA; --muted: #A7B0C0; --accent: #4D7EEF; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body {
      font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px 16px;
    }
    main { width: 100%; max-width: 560px; }
    h1 { font-size: clamp(2rem, 7vw, 2.75rem); line-height: 1.15; margin: 0 0 12px; letter-spacing: -0.02em; }
    p { margin: 0 0 16px; color: var(--muted); }
    ul { list-style: none; padding: 0; margin: 32px 0 0; border-top: 1px solid #1C2233; }
    li { border-bottom: 1px solid #1C2233; padding: 16px 0; }
    a { color: var(--accent); text-decoration: none; font-weight: 600; }
    a:hover, a:focus-visible { text-decoration: underline; }
    footer { margin-top: 40px; font-size: 14px; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>The Global Pulse</h1>
    <p>Information about the app, its privacy policy and how to get support.</p>
    <ul>
      <li><a href="privacy.html">Privacy Policy</a></li>
      <li>Support: <a href="mailto:niplerr@gmail.com">niplerr@gmail.com</a></li>
    </ul>
    <footer>&copy; The Global Pulse</footer>
  </main>
</body>
</html>
